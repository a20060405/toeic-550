<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6f9"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>TOEIC 550 · 90 Days</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#243447;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;line-height:1.55}main{max-width:760px;margin:auto;padding: max(24px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom))}h1,h2,p{margin:0}h1{font-size:36px;letter-spacing:-1px}h2{font-size:23px}small,.muted{color:#64748b}.eyebrow{font-size:12px;letter-spacing:3px;color:#245ca6;font-weight:700}.hero,.card,.day{border-radius:12px;padding:18px;background:#fff;border:1px solid #dce3eb}.hero{background:#e8f0fa;margin:20px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats{display:flex;gap:25px;margin:12px 0}.stats b{font-size:24px;display:block}button,input{font:inherit}button{border:0;cursor:pointer;background:#e8f0fa;color:#243447;border-radius:8px;padding:11px 15px;min-height:44px;font-weight:600}button:disabled{opacity:.45;cursor:default}.primary{background:#245ca6;color:white}.day{text-align:left;width:100%;min-height:92px}.day b{display:block;font-size:20px}.day.done{background:#e3eefb;border-color:#a9c5e8}.week{margin:26px 0 12px}.bar{height:7px;background:#dce5f0;border-radius:8px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#2864b4;border-radius:8px}.card{margin:10px 0}.word{font-size:25px;overflow-wrap:anywhere;font-weight:700}.tag{font-size:12px;color:#245ca6;background:#edf2f7;padding:4px 9px;border-radius:8px}.meaning{white-space:pre-line;font-size:15px;margin:8px 0;overflow-wrap:anywhere}.check{display:flex;gap:7px;align-items:center;font-size:14px}.check input{width:21px;height:21px;accent-color:#245ca6}.section{margin-top:22px}.foot{margin-top:24px;font-size:12px}.actions{margin:16px 0}.hidden{display:none}.note{padding:12px;background:#edf2f7;border-radius:12px;margin:12px 0;font-size:14px}a{color:#245ca6}button:focus-visible{outline:3px solid #245ca6;outline-offset:2px}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hero{border-color:#cbdced}.day:hover{border-color:#7fa5d4}.day.done b{color:#245ca6}.card{box-shadow:0 1px 3px #2434470a}.stats b{font-variant-numeric:tabular-nums}.eyebrow{letter-spacing:2px}.primary:hover{background:#194a89}</style></head><body><main id="app"></main><script src="words.js"></script><script>
const lessons=window.LESSONS, app=document.querySelector('#app'), key='toeic550-v1';let state={known:{},review:{},hide:false};try{const old=JSON.parse(localStorage.getItem(key));if(old)state={...state,...old}}catch{}let hide=false;const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{alert('無法儲存進度，請確認瀏覽器允許本機儲存。')}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pad=n=>String(n).padStart(2,'0');const all=Object.values(lessons).flat();const done=d=>lessons[d]?lessons[d].every(w=>state.known[w.word]):!!state.review[d];const dayFromHash=()=>{let n=Number(location.hash.slice(1));return Number.isInteger(n)&&n>=1&&n<=90?n:0};function go(d){location.hash=d?String(d):''}function render(){const d=dayFromHash();d?lesson(d):home()}function home(){const n=all.filter(w=>state.known[w.word]).length;let html=`<div class="eyebrow">MY ENGLISH JOURNEY</div><h1>TOEIC 550.</h1><p class="muted">每天進步一點，90 天後看見成果。</p><div class="hero"><div class="stats"><div><b>550</b><small>目標分數</small></div><div><b>${n}</b><small>已記住 / 1200</small></div><div><b>${Array.from({length:90},(_,i)=>i+1).filter(done).length}</b><small>完成天數 / 90</small></div></div><div class="bar"><i style="width:${n/12}%"></i></div><button class="primary" onclick="go(nextDay())">繼續學習 →</button></div>`;for(let w=0;w<13;w++){html+=`<h2 class="week">Week ${pad(w+1)} <small>／${w===12?'總複習':'新字與複習'}</small></h2><div class="grid">`;for(let i=1;i<=7&&w*7+i<=90;i++){let d=w*7+i;html+=`<button class="day ${done(d)?'done':''}" onclick="go(${d})"><b>Day ${pad(d)} ${done(d)?'✓':''}</b><small>${lessons[d]?'20 個新單字':w===12?'總複習':'複習與自測'}</small></button>`}html+='</div>'}app.innerHTML=html+'<p class="foot">詞彙來自 LexiJong 候選學習字庫，非官方多益清單。<br><a href="ECDICT-LICENSE.txt">字庫授權</a> · 進度僅儲存在此瀏覽器。</p>'}function nextDay(){return Array.from({length:90},(_,i)=>i+1).find(d=>!done(d))||90}function reviewWords(d){if(d<=84){const start=Math.floor((d-1)/7)*7+1;return Array.from({length:5},(_,i)=>lessons[start+i]||[]).flat()}const missed=all.filter(w=>!state.known[w.word]);const pool=missed.length?missed:all;return pool.slice((d-85)*20%pool.length,(d-85)*20%pool.length+20)}function lesson(d){const ws=lessons[d]||reviewWords(d), isReview=!lessons[d];let h=`<div class="row"><button onclick="go(0)">‹ 學習日曆</button><small>WEEK ${pad(Math.ceil(d/7))}</small></div><div class="section"><div class="eyebrow">DAILY VOCABULARY</div><h1>Day ${pad(d)}</h1><p class="muted">${isReview?'複習與自測':'基礎、中等、進階混合學習'}</p></div><div class="hero"><div class="row"><b id="progress">${ws.filter(w=>state.known[w.word]).length} / ${ws.length} 已記住</b><button onclick="toggleHide()">${hide?'顯示中文':'遮住中文'}</button></div><div class="bar"><i id="progressbar" style="width:${100*ws.filter(w=>state.known[w.word]).length/ws.length}%"></i></div></div>`;if(isReview)h+=`<div class="note">${d>=85?'優先複習尚未記住的單字，並搭配閱讀及聽力練習。':'複習本週 100 字；可遮住中文進行自測。'}</div>`;for(let i=0;i<ws.length;i++){const w=ws[i];h+=`<article class="card"><div class="row"><span class="tag">${['','基礎','中等','進階'][w.level]||'未分類'}${w.isToeic?' · 多益重點':''}</span><label class="check"><input type="checkbox" ${state.known[w.word]?'checked':''} onchange="mark(${d},${i},this.checked)">已記住</label></div><div class="row"><div class="word">${esc(w.word)}</div><button aria-label="播放英文發音" onclick="speak(${d},${i})">▶ 發音</button></div><small>${esc(w.phonetic)} ${esc(w.partOfSpeech)}</small><div class="meaning ${hide?'hidden':''}">${esc(w.meaning)}</div>${w.example?`<div class="muted ${hide?'hidden':''}">${esc(w.example)}<br>${esc(w.exampleTranslation)}</div>`:''}</article>`}h+=`<div class="actions row"><button ${d===1?'disabled':''} onclick="go(${d-1})">‹ 前一天</button>${isReview?`<button class="primary" onclick="finishReview(${d})">${state.review[d]?'已完成複習':'完成複習'}</button>`:''}<button class="primary" onclick="go(${d===90?0:d+1})">${d===90?'返回日曆':'下一天 →'}</button></div>`;app.innerHTML=h;window.currentWords=ws}function mark(d,i,v){const ws=window.currentWords;state.known[ws[i].word]=v;save();let n=ws.filter(w=>state.known[w.word]).length;document.querySelector('#progress').textContent=`${n} / ${ws.length} 已記住`;document.querySelector('#progressbar').style.width=100*n/ws.length+'%'}function toggleHide(){hide=!hide;const y=scrollY;lesson(dayFromHash());scrollTo(0,y)}function finishReview(d){state.review[d]=true;save();go(0)}function speak(d,i){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音播放');return}const u=new SpeechSynthesisUtterance(window.currentWords[i].word);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}window.addEventListener('hashchange',()=>{hide=false;render();scrollTo(0,0)});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
